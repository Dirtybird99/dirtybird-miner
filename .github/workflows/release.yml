name: Release

# workflow_dispatch is a dry run: every build job runs and uploads artifacts,
# but the publish job is skipped, so nothing reaches the release page.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version || steps.dryrun.outputs.version }}
      tag: ${{ steps.version.outputs.tag || steps.dryrun.outputs.tag }}
      commit: ${{ steps.version.outputs.commit || steps.dryrun.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve tag
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release workflow must run from a tag"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" \
            --jq '.object.sha')"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" \
              --jq '.object.type')" != "tag" ]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi

          COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" \
            --jq '.object.sha')"
          if [ "$COMMIT" != "$TAG_COMMIT" ]; then
            echo "::error::Checkout $COMMIT does not match $TAG ($TAG_COMMIT)"
            exit 1
          fi

          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" \
              --jq '.verification.verified')" != "true" ]; then
            echo "::error::$TAG does not have a signature verified by GitHub"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # Dry-run identity: a version that can never collide with a real tag, so
      # the build jobs run byte-identical logic against needs.verify.outputs.*.
      - name: Resolve dry-run version
        id: dryrun
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "tag=v0.0.0-dry" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-dry" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show changelog preview
        if: github.event_name == 'push'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..${GITHUB_REF_NAME}"
          else
            git log --pretty=format:"- %s (%h)" | head -20
          fi

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-compiler-rt
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-llvm-openmp
            mingw-w64-x86_64-mimalloc
            make

      # LTO + PGO two-pass build (scripts/build-pgo.sh). Restores the ~20% the
      # released binaries left on the table (CI previously shipped -DDISABLE_LTO=ON
      # and no PGO). LTO links cleanly under clang+lld; the old static-link reason
      # for DISABLE_LTO no longer applies (release links dynamic / copies DLLs).
      - name: Build (LTO + PGO)
        shell: msys2 {0}
        run: |
          export CMAKE_ARGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
          export TRAIN_SECS=60
          bash scripts/build-pgo.sh

      # Gate the release on hash correctness: LTO+PGO is aggressive enough to
      # miscompile the hand-written hot path, and a fast WRONG hash is worse than
      # a slow right one. --selftest computes pow("a") and exits 1 on mismatch.
      - name: Version, self-test, and smoke
        shell: msys2 {0}
        run: |
          test "$(./build/bin/dirtybird-c-miner.exe --version | tr -d '\r')" = \
            "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
          ./build/bin/dirtybird-c-miner.exe --selftest
          ./build/bin/dirtybird-c-miner.exe --help > /dev/null

      - name: Package
        shell: pwsh
        run: ./scripts/release.ps1 -Version ${{ needs.verify.outputs.tag }} -BuildDir build -OutputDir dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist/*.zip

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm cmake ninja-build lld patchelf \
            libboost-all-dev libssl-dev libomp-dev \
            libnuma-dev libudns-dev libmimalloc-dev

      # LTO + PGO two-pass build (see scripts/build-pgo.sh). Same code+SIMD as the
      # Windows build; with matched flags this restores Linux/AMD to Windows-class
      # hashrate (CI previously shipped -DDISABLE_LTO=ON and no PGO, ~20% slower).
      - name: Build (LTO + PGO)
        run: |
          export CMAKE_ARGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
          export TRAIN_SECS=60
          bash scripts/build-pgo.sh

      # Gate on hash correctness (LTO+PGO is new to this path; a fast wrong hash
      # is worse than a slow right one). --selftest exits 1 on pow("a") mismatch.
      - name: Version, self-test, and smoke
        run: |
          test "$(./build/bin/dirtybird-c-miner --version)" = \
            "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
          ./build/bin/dirtybird-c-miner --selftest
          ./build/bin/dirtybird-c-miner --help > /dev/null
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package
        run: bash ./scripts/release.sh "${{ needs.verify.outputs.tag }}" build dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist/*.tar.gz

  build-hiveos:
    name: Build HiveOS/MMPOS Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build lld patchelf libssl-dev

      # LTO + PGO two-pass build (see scripts/build-pgo.sh). HiveOS/MMPOS rigs are
      # x86_64 -- identical code+SIMD to Windows, so matched flags = matched hashrate.
      - name: Build (LTO + PGO)
        run: |
          export CMAKE_ARGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
          export TRAIN_SECS=60
          bash scripts/build-pgo.sh

      # Gate on hash correctness (LTO+PGO is new to this path; a fast wrong hash
      # is worse than a slow right one). --selftest exits 1 on pow("a") mismatch.
      - name: Version, self-test, and smoke
        run: |
          test "$(./build/bin/dirtybird-c-miner --version)" = \
            "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
          ./build/bin/dirtybird-c-miner --selftest
          ./build/bin/dirtybird-c-miner --help > /dev/null

      - name: Package (HiveOS/MMPOS)
        run: bash ./scripts/release-hiveos.sh "${{ needs.verify.outputs.tag }}" build dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-hiveos
          path: dist/*.tar.gz

  build-android:
    name: Build Android (aarch64) Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      # binfmt so the static aarch64 PGO trainer runs on the x86 runner.
      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Cross-build OpenSSL for android-arm64 (static)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch openssl-3.5.7 \
            https://github.com/openssl/openssl ossl-src
          test "$(git -C ossl-src rev-parse HEAD)" = \
            "8cf17aaeb4599f8af87fefd810b5b5fee90fe69e"
          cd ossl-src
          ./Configure android-arm64 -D__ANDROID_API__=24 no-shared no-tests no-docs \
            --prefix="$GITHUB_WORKSPACE/ossl-android"
          make -j"$(nproc)" build_libs
          make install_dev

      # Full LTO + PGO for Android, via a NATIVE aarch64 profile (same arch + same
      # clang-18 as the NDK -> the hot path matches cleanly; verified locally: 1
      # profile-mismatch warning vs 15 for an x86 profile). build-pgo.sh builds a
      # static instrumented trainer (GEN_CMAKE_ARGS=-static) that runs under QEMU
      # binfmt to collect the profile, then builds the normal dynamic release miner
      # with -fprofile-use. Android is silicon-bound (a phone won't match a desktop
      # CPU) but now ships with the same optimization level as every other platform.
      - name: Build (LTO + PGO via NDK + QEMU)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static -DOPENSSL_ROOT_DIR=$GITHUB_WORKSPACE/ossl-android -DOPENSSL_USE_STATIC_LIBS=TRUE -DCMAKE_FIND_ROOT_PATH=$GITHUB_WORKSPACE/ossl-android -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
          export GEN_CMAKE_ARGS="-DCMAKE_EXE_LINKER_FLAGS=-static"
          export PROFDATA="$NDKBIN/llvm-profdata"
          export BUILD_DIR=build-android TRAIN_SECS=40 TRAIN_THREADS=4
          bash scripts/build-pgo.sh

      - name: Verify ELF and embedded version (aarch64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDKBIN/llvm-readelf" -h \
            build-android/bin/dirtybird-c-miner | grep -iE 'Machine|Class'
          "$NDKBIN/llvm-strings" build-android/bin/dirtybird-c-miner \
            | grep -Fx "${{ needs.verify.outputs.version }}"

      - name: Package (Android)
        run: bash ./scripts/release-android.sh "${{ needs.verify.outputs.tag }}" build-android dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*.tar.gz

  build-linux-arm64:
    name: Build Linux (aarch64) Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      # Everything runs inside a native arm64 userland (emulated): apt provides
      # arm64 OpenSSL, and release.sh's ldd/patchelf bundling only works with an
      # arm64 toolchain. Same LTO+PGO recipe as the other platforms; emulated
      # training follows the Android job (TRAIN_SECS=40 @ 4 threads). llvm is
      # needed for llvm-profdata, binutils for readelf.
      - name: Build, self-test, and package (arm64 container)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src \
            arm64v8/ubuntu:24.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              clang lld llvm cmake ninja-build libssl-dev patchelf \
              libclang-rt-dev binutils ca-certificates git
            export CMAKE_ARGS="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
            export TRAIN_SECS=40 TRAIN_THREADS=4
            bash scripts/build-pgo.sh
            test "$(./build/bin/dirtybird-c-miner --version)" = \
              "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
            ./build/bin/dirtybird-c-miner --selftest
            ./build/bin/dirtybird-c-miner --help > /dev/null
            PACKAGE_ARCH=arm64 bash ./scripts/release.sh \
              "${{ needs.verify.outputs.tag }}" build dist
            mkdir -p /tmp/verify
            tar -xzf "dist/dirtybird-c-miner-arm64-${{ needs.verify.outputs.tag }}.tar.gz" \
              -C /tmp/verify
            /tmp/verify/*/dirtybird-c-miner --selftest
          '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-arm64
          path: dist/*.tar.gz

  build-macos:
    name: Build macOS (arm64) Release
    runs-on: macos-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          lfs: true

      # The asset name hard-codes arm64; fail loudly if the runner alias ever
      # changes architecture instead of shipping a mislabeled binary.
      - name: Assert arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Install dependencies
        run: brew install openssl@3 ninja

      # Apple clang + ld64 (CMake gates -fuse-ld=lld off on APPLE; ld64 does LTO
      # natively). Static Homebrew OpenSSL so the tarball is self-contained.
      # PGO trains natively on the M-series runner; PROFDATA points build-pgo.sh
      # at the Xcode-toolchain llvm-profdata that matches Apple clang's profile
      # format.
      - name: Build (LTO + PGO)
        run: |
          export CMAKE_ARGS="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) -DOPENSSL_USE_STATIC_LIBS=TRUE -DDIRTYBIRD_C_VERSION=${{ needs.verify.outputs.version }}"
          export PROFDATA="$(xcrun -f llvm-profdata)"
          export TRAIN_SECS=60
          bash scripts/build-pgo.sh

      # Gate on hash correctness (first macOS release path; a fast wrong hash is
      # worse than a slow right one). --selftest exits 1 on pow("a") mismatch.
      - name: Version, self-test, and smoke
        run: |
          test "$(./build/bin/dirtybird-c-miner --version)" = \
            "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
          ./build/bin/dirtybird-c-miner --selftest
          ./build/bin/dirtybird-c-miner --help > /dev/null
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package (macOS)
        run: bash ./scripts/release-macos.sh "${{ needs.verify.outputs.tag }}" build dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: dist/*.tar.gz

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    needs: [verify, build-windows, build-linux, build-hiveos, build-android, build-linux-arm64, build-macos]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          lfs: true

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## DIRTYBIRD C Miner $TAG"
            echo
            echo "Assets:"
            echo "- dirtybird-c-miner-win64-$TAG.zip"
            echo "- dirtybird-c-miner-amd64-$TAG.tar.gz"
            echo "- dirtybird-c-miner-arm64-$TAG.tar.gz"
            echo "- dirtybird-c-miner-${TAG}_linux_hiveos_mmpos.tar.gz"
            echo "- dirtybird-c-miner-${TAG}_aarch64_android.tar.gz"
            echo "- dirtybird-c-miner-macos-arm64-$TAG.tar.gz"
            echo "- SHA256SUMS.txt"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG"
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD"
            else
              echo "## Initial release"
              git log --pretty=format:"- %s (%h)" | head -20
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Verify assets and generate checksums
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          cd artifacts
          test -f "dirtybird-c-miner-win64-$TAG.zip"
          test -f "dirtybird-c-miner-amd64-$TAG.tar.gz"
          test -f "dirtybird-c-miner-arm64-$TAG.tar.gz"
          test -f "dirtybird-c-miner-${TAG}_linux_hiveos_mmpos.tar.gz"
          test -f "dirtybird-c-miner-${TAG}_aarch64_android.tar.gz"
          test -f "dirtybird-c-miner-macos-arm64-$TAG.tar.gz"
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify packaged Linux binary
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          mkdir verify-linux
          tar -xzf "artifacts/dirtybird-c-miner-amd64-$TAG.tar.gz" -C verify-linux
          BIN="$(find verify-linux -type f -name dirtybird-c-miner -print -quit)"
          test -n "$BIN"
          test "$("$BIN" --version)" = "Dirtybird C Miner v${{ needs.verify.outputs.version }}"
          "$BIN" --selftest

      - name: Create immutable-ready release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_OBJECT" --jq '.object.sha')" = \
            "${{ needs.verify.outputs.commit }}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified')" = "true"
          ASSETS=(artifacts/*.zip artifacts/*.tar.gz artifacts/SHA256SUMS.txt)
          gh release create "$TAG" "${ASSETS[@]}" \
            --verify-tag --title "DIRTYBIRD C Miner $TAG" \
            --notes-file RELEASE_NOTES.md
          test "$(gh release view "$TAG" --json isImmutable \
            --jq '.isImmutable')" = true
          for attempt in 1 2 3; do
            ok=true
            gh release verify "$TAG" || ok=false
            for asset in "${ASSETS[@]}"; do
              gh release verify-asset "$TAG" "$asset" || ok=false
            done
            $ok && exit 0
            sleep 5
          done
          exit 1
