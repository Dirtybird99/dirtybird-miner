name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: dirtybird-c-miner-windows-bin
            artifact_path: build/bin/*
          - name: Linux
            os: ubuntu-latest
            artifact_name: dirtybird-c-miner-linux-bin
            artifact_path: build/bin/*
          - name: macOS
            os: macos-latest
            artifact_name: dirtybird-c-miner-macos-bin
            artifact_path: build/bin/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-llvm-openmp
            mingw-w64-x86_64-mimalloc
            make

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build lld patchelf \
            libboost-all-dev libssl-dev libomp-dev \
            libnuma-dev libudns-dev libmimalloc-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      # Apple clang (default toolchain); static Homebrew OpenSSL, same as the
      # release job, so CI compiles exactly what a release would ship.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      # Builds every target, not just the miner: the unit tests below live in
      # tools/replay and would not exist otherwise.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      # The unit suite (statusline layout, stage5 descriptor, v1.14 encode,
      # self-diff, ...) used to build in CI and never run, so a regression in any
      # of it reached a release with a green tick.
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Unit tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build/bin/dirtybird-c-miner.exe --help > /dev/null

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/bin/dirtybird-c-miner --help > /dev/null

      - name: Package verification (Linux)
        if: runner.os == 'Linux'
        run: |
          bash ./scripts/release.sh v0.0.0-ci build dist
          tar -tzf dist/dirtybird-c-miner-amd64-v0.0.0-ci.tar.gz | grep -q 'dirtybird-c-miner-amd64-v0.0.0-ci/dirtybird-c-miner'

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build/bin/dirtybird-c-miner.exe --selftest

      - name: Self-test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/bin/dirtybird-c-miner --selftest

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7

  build-test-arm64:
    name: Build and KAT (linux-aarch64, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Build + run the ARM checks inside a native arm64 userland (emulated).
      # Native arm64 apt provides arm64 OpenSSL, so no cross-compile/cross-apt
      # gymnastics; --selftest exits 0 only if the ARM hashes match the KAT.
      - name: Build + test in arm64 container
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src arm64v8/ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends clang lld cmake ninja-build libssl-dev ca-certificates
            cmake -S . -B build-arm64 -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build build-arm64 \
              --target dirtybird-c-miner dirtybird-c-pgo-train test_stage5_descriptor \
              --parallel
            echo "=== arch: $(uname -m) ==="
            echo "=== pow(a) KAT (native arm64) ==="
            ./build-arm64/bin/dirtybird-c-miner --selftest
            echo "=== stage5 descriptor ==="
            ./build-arm64/bin/test_stage5_descriptor
            echo "=== benchmark warmup ==="
            ./build-arm64/bin/dirtybird-c-pgo-train \
              -t 1 --warmup-seconds 1 --seconds 1 --rotate-ms 0 |
              tee benchmark.log
            grep -Eq "^benchmark_result threads=1 warmup_s=1 elapsed_s=[0-9.]+ hashes=[1-9][0-9]* kh_s=[0-9.]+" benchmark.log
            echo "=== profiler unit ==="
            DLUNA_PROFILE=1 ./build-arm64/bin/dirtybird-c-pgo-train \
              -t 1 --seconds 300 --hashes 1024 --rotate-ms 0 |
              tee profiler.log
            grep -Eq "^\[PROF tid=.* ns/hash=[1-9][0-9]*" profiler.log
          '

  build-android:
    name: Build Android (aarch64 NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cross-build OpenSSL for android-arm64 (static)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch openssl-3.5.7 \
            https://github.com/openssl/openssl ossl-src
          test "$(git -C ossl-src rev-parse HEAD)" = \
            "8cf17aaeb4599f8af87fefd810b5b5fee90fe69e"
          cd ossl-src
          ./Configure android-arm64 -D__ANDROID_API__=24 no-shared no-tests no-docs \
            --prefix="$GITHUB_WORKSPACE/ossl-android"
          make -j"$(nproc)" build_libs
          make install_dev

      - name: Configure (Android NDK)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/ossl-android" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_FIND_ROOT_PATH="$GITHUB_WORKSPACE/ossl-android" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DDIRTYBIRD_C_VERSION=0.0.0-ci

      - name: Verify Android excludes x86 SHA shim
        run: |
          if grep -E -- '--wrap=SHA256_|sha256_ni\.cpp' build-android/build.ninja; then
            echo "Android build includes the x86 SHA shim"
            exit 1
          fi

      - name: Build
        run: |
          cmake --build build-android \
            --target dirtybird-c-miner dirtybird-c-pgo-train \
            --parallel

      - name: Verify ELFs (aarch64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for binary in dirtybird-c-miner dirtybird-c-pgo-train; do
            "$READELF" -h "build-android/bin/$binary" |
              grep -q 'Machine:.*AArch64'
          done

      - name: Upload Android test binaries
        uses: actions/upload-artifact@v4
        with:
          name: dirtybird-c-miner-android-arm64-ci
          path: |
            build-android/bin/dirtybird-c-miner
            build-android/bin/dirtybird-c-pgo-train
          retention-days: 7

  lint:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check for large tracked files
        run: |
          git ls-files | while read -r path; do
            if [ -f "$path" ] && [ "$(wc -c < "$path")" -gt 5242880 ]; then
              echo "$path"
            fi
          done > large_files.txt
          if [ -s large_files.txt ]; then
            echo "::warning::Tracked files over 5 MB:"
            cat large_files.txt
          fi

      - name: Check for CRLF in source files
        run: |
          if git ls-files '*.cpp' '*.hpp' '*.h' '*.c' | xargs grep -l $'\r' 2>/dev/null; then
            echo "::warning::CRLF line endings detected in source files"
          fi

      # Shell scripts are how users install the miner (termux-setup.sh is piped
      # straight into bash from the README), so a syntax error ships as a broken
      # installer. Nothing lint-checked them before.
      #
      # Pinned to error severity on purpose: these scripts deliberately build
      # printf format strings out of the colour variables, which is a firehose of
      # SC2059 notes. Errors are the ones that mean "this script is broken".
      - name: Shell script lint
        run: |
          sudo apt-get update && sudo apt-get install -y jq shellcheck
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done
          shellcheck --severity=error $(git ls-files '*.sh')
          bash tests/termux-setup-smoke.sh
